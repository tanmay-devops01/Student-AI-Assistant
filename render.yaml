services:
  - type: web
    name: student-ai-assistant
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: AI_MODEL
        value: gpt-4o-mini
databases:
  - name: student-db
    plan: free
    databaseName: student_assistant
