{% extends "base.html" %}

{% block title %}Form Expired - Student AI Assistant{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-5">
        <div class="card text-center">
            <div class="card-body p-5">
                <div class="card-icon icon-warning mx-auto mb-3">
                    <i class="fas fa-shield-halved"></i>
                </div>
                <h1 class="h4">This form has expired</h1>
                <p class="text-muted">Reload the page and submit the form again.</p>
                <a class="btn btn-primary" href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.login') }}">
                    <i class="fas fa-arrow-left me-2"></i>Return to the app
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
